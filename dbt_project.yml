# =============================================================================
# GoldenTime · dbt_project.yml
# Configuración central del proyecto: nombre, rutas y configuración por carpeta.
# =============================================================================
name: goldentime                
version: '1.0.0'
profile: default                

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
docs-paths: ["docs"]

clean-targets: ["target", "dbt_packages"]

models:
  goldentime:
    +transient: false            

    staging:                     # stg_: renombrar y poner tipos, 1:1 con Bronze
      +materialized: view
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      erp:
        +schema: erp
      chrono24:
        +schema: chrono24
      bce:
        +schema: bce

    silver:                      # slv_: una tabla por entidad del modelo lógico
      +materialized: table
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      erp:                      
        +schema: erp
      chrono24:
        +schema: chrono24
      bce:
        +schema: bce

    gold:                        # modelo dimensional
      +materialized: table
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      intermediate:
        +materialized: view
        +schema: intermediate
      core:                      # dim_ y fct_
        +schema: core
        +grants:
          select: ['GT_REPORTING_ROLE']   # el dashboard solo lee Gold 

seeds:
  goldentime:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds
    moneda:
      +column_types:                 # tipos fijos: dbt no los adivina del CSV
        codigo_moneda: varchar(3)
        nombre_moneda: varchar(50)
    correccion_nombre_modelo:
      +column_types:
        nombre_erroneo: varchar(100)
        nombre_correcto: varchar(100)
    diccionario_valores:
      +column_types:
        campo: varchar(20)
        valor_original: varchar(50)
        valor_limpio: varchar(50)